<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助詞パズル - Particle Practice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 画面1: モード選択 -->
        <div id="home-screen" class="screen active">
            <div class="jp-header">
                <div class="jp-eyebrow">助詞パズル</div>
                <h1 class="jp-title">Chọn trợ từ đúng</h1>
                <div class="jp-title-sub">正しい助詞を選ぼう</div>
            </div>
            <p class="subtitle">Chọn chế độ / モードを選んでください</p>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="app.showNormalModeMenu()">Chế độ luyện tập<br><small>通常練習モード</small></button>
                <button class="menu-btn" onclick="app.startTimeAttack()">Thử thách 30 giây<br><small>タイムアタックモード</small></button>
                <button class="menu-btn" onclick="app.shuffleAllQuestions()">Trộn tất cả câu hỏi<br><small>問題をシャッフル</small></button>
            </div>
            <a class="download-link" href="joshi-hayamihyou.pdf" download="joshi-hayamihyou.pdf" title="Tải bảng tra cứu trợ từ (PDF)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 15px; height: 15px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Tài liệu trợ từ <small>(助詞早見表 PDF)</small>
            </a>
        </div>

        <!-- 画面2: 通常練習メニュー -->
        <div id="normal-menu-screen" class="screen">
            <div class="jp-header">
                <h2 class="jp-title">Chế độ luyện tập thường</h2>
                <div class="jp-title-sub">通常練習モード</div>
            </div>
            <p class="subtitle">Chọn đơn vị và bộ câu hỏi / 単位とセットを選んでください</p>
            <div id="unit-buttons" class="menu-buttons">
                <!-- JSで生成 -->
            </div>
            <button class="back-btn" onclick="app.showHome()">← Trở lại / 戻る</button>
        </div>

        <!-- 画面3: 練習画面 -->
        <div id="practice-screen" class="screen">
            <div class="header-bar">
                <span id="progress-text">問題 1 / 25</span>
                <span id="timer-text" class="hidden">残り: 30秒</span>
            </div>
            
            <div class="jp-progress" id="jp-progress"></div>

            <div class="jp-sentence-wrap">
                <button id="tts-btn" class="tts-button" onclick="app.playTTS()" title="音声を再生">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <div class="jp-sentence-vi" id="question-text-vi"></div>
                <div class="jp-sentence" id="question-text"></div>
            </div>

            <div class="jp-tray-label">ここから選んでください</div>
            <div class="jp-tray" id="options-container">
                <!-- JSで生成 -->
            </div>

            <div id="explanation-area" class="jp-explanation hidden">
                <h3>Giải thích / 解説</h3>
                <p class="exp-main"><span id="exp-vi"></span></p>
                <p class="exp-sub">日本語: <span id="exp-ja"></span></p>
            </div>

            <div class="jp-footer">
                <button id="next-btn" class="jp-next-btn" onclick="app.nextQuestion()">Tiếp theo → / つぎへ</button>
            </div>
        </div>

        <!-- 画面4: 結果画面 -->
        <div id="result-screen" class="screen">
            <div class="jp-result">
                <div class="jp-result-label">RESULT</div>
                <div class="jp-result-score" id="result-score"></div>
                <div class="jp-result-detail-vi" id="result-detail-vi"></div>
                <div class="jp-result-detail-jp" id="result-detail-jp"></div>
                <button class="jp-retry-btn" onclick="app.showHome()">Về trang chủ / ホームに戻る</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
