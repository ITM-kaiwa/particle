<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助詞パズル - Particle Practice</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 画面1: モード選択 -->
        <div id="home-screen" class="screen active">
            <div class="jp-header">
                <div class="jp-eyebrow">助詞パズル</div>
                <h1 class="jp-title">正しい助詞を選ぼう</h1>
            </div>
            <p class="subtitle">モードを選んでください / Chọn chế độ</p>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="app.showNormalModeMenu()">通常練習モード<br><small>Chế độ luyện tập</small></button>
                <button class="menu-btn" onclick="app.startTimeAttack()">タイムアタックモード<br><small>Thử thách 30 giây</small></button>
                <button class="menu-btn" onclick="app.shuffleAllQuestions()">問題をシャッフル<br><small>Trộn tất cả câu hỏi</small></button>
            </div>
        </div>

        <!-- 画面2: 通常練習メニュー -->
        <div id="normal-menu-screen" class="screen">
            <div class="jp-header">
                <h2 class="jp-title">通常練習モード</h2>
            </div>
            <p class="subtitle">単位とセットを選んでください</p>
            <div id="unit-buttons" class="menu-buttons">
                <!-- JSで生成 -->
            </div>
            <button class="back-btn" onclick="app.showHome()">← 戻る / Trở lại</button>
        </div>

        <!-- 画面3: 練習画面 -->
        <div id="practice-screen" class="screen">
            <div class="header-bar">
                <span id="progress-text">問題 1 / 25</span>
                <span id="timer-text" class="hidden">残り: 30秒</span>
            </div>
            
            <div class="jp-progress" id="jp-progress"></div>

            <div class="jp-sentence-wrap">
                <button id="tts-btn" class="tts-button" onclick="app.playTTS()" title="音声を再生">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <div class="jp-sentence" id="question-text"></div>
                <div class="jp-sentence-vi" id="question-text-vi"></div>
            </div>

            <div class="jp-tray-label">ここから選んでください</div>
            <div class="jp-tray" id="options-container">
                <!-- JSで生成 -->
            </div>

            <div id="explanation-area" class="jp-explanation hidden">
                <h3>解説 / Giải thích</h3>
                <p><strong>日本語:</strong> <span id="exp-ja"></span></p>
                <p><strong>Tiếng Việt:</strong> <span id="exp-vi"></span></p>
            </div>

            <div class="jp-footer">
                <button id="next-btn" class="jp-next-btn" onclick="app.nextQuestion()">つぎへ →</button>
            </div>
        </div>

        <!-- 画面4: 結果画面 -->
        <div id="result-screen" class="screen">
            <div class="jp-result">
                <div class="jp-result-label">RESULT</div>
                <div class="jp-result-score" id="result-score"></div>
                <div class="jp-result-label" id="result-detail"></div>
                <button class="jp-retry-btn" onclick="app.showHome()">ホームに戻る / Về trang chủ</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
